<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注文確認</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      padding: 32px 24px;
      text-align: center;
      box-sizing: border-box;
    }
    .title {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 700;
    }
    .message {
      margin: 0;
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .loading {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid #ddd;
      border-top: 3px solid #333;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    .sub {
      margin-top: 10px;
      color: #666;
      font-size: 14px;
    }
    .error {
      color: #c62828;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div id="loadingArea">
        <div class="loading"></div>
        <h1 class="title">認証確認中</h1>
        <p class="message">端末情報を確認しています...</p>
      </div>

      <div id="resultArea" style="display:none;">
        <h1 class="title" id="resultTitle">ご案内</h1>
        <p class="message" id="resultMessage"></p>
        <p class="sub" id="resultSub"></p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // ★重要：ご自身のGAS WebアプリURLに差し替えてください
      const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbx5kqUSYOCbSZODRZOgcLw5CAkWMoT3HgRi-iVzR7l0RTR6hwOT0lSQ_tQAume_APeuIA/exec';

      const loadingArea = document.getElementById('loadingArea');
      const resultArea = document.getElementById('resultArea');
      const resultTitle = document.getElementById('resultTitle');
      const resultMessage = document.getElementById('resultMessage');
      const resultSub = document.getElementById('resultSub');

      function showMessage(title, message, sub, isError) {
        loadingArea.style.display = 'none';
        resultArea.style.display = 'block';
        resultTitle.textContent = title || 'ご案内';
        resultMessage.textContent = message || '';
        resultSub.textContent = sub || '';
        resultMessage.className = isError ? 'message error' : 'message';
      }

      // URLから注文ID(tableId)を取得
      function getTableIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return (params.get('tableId') || '').trim();
      }

      // スマホ端末固有のIDを取得または新規生成して保存
      function getOrCreateDeviceId() {
        let deviceId = localStorage.getItem('app_unique_device_id');
        if (!deviceId) {
          // ランダムな文字列を生成してデバイスIDとする
          deviceId = 'dev-' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
          localStorage.setItem('app_unique_device_id', deviceId);
        }
        return deviceId;
      }

      async function main() {
        try {
          const tableId = getTableIdFromUrl();
          const deviceId = getOrCreateDeviceId();

          if (!tableId) {
            showMessage('エラー', '注文IDが指定されていません。', 'URLに ?tableId=xxx を含めてください。', true);
            return;
          }

          // GASへ注文IDとデバイスIDを送信
          const url = `${GAS_ENDPOINT}?tableId=${encodeURIComponent(tableId)}&deviceId=${encodeURIComponent(deviceId)}`;

          const response = await fetch(url, {
            method: 'GET',
            cache: 'no-store'
          });

          if (!response.ok) {
            showMessage('通信エラー', 'サーバーへの接続に失敗しました。', 'Status: ' + response.status, true);
            return;
          }

          const data = await response.json();

          // GAS側で一致しない（ok: false）と判定された場合
          if (!data || data.ok !== true) {
            showMessage(
              'アクセス制限',
              data.message || 'この注文を表示する権限がありません。',
              '他の端末で既に注文が開始されている可能性があります。',
              true
            );
            return;
          }

          // 一致した場合、AppSheetへリダイレクト
          if (data.shouldRedirect && data.redirectUrl) {
            window.location.replace(data.redirectUrl);
            return;
          }

          showMessage('完了', data.message || '認証に成功しました。', '', false);

        } catch (error) {
          showMessage('システムエラー', '予期しないエラーが発生しました。', error.message, true);
        }
      }

      main();
    })();
  </script>
</body>
</html>
