<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注文確認</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      padding: 32px 24px;
      text-align: center;
      box-sizing: border-box;
    }
    .title { margin: 0 0 12px; font-size: 24px; font-weight: 700; }
    .message { margin: 0; font-size: 16px; line-height: 1.7; white-space: pre-wrap; }
    .loading {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid #ddd;
      border-top: 3px solid #333;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    .error { color: #c62828; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div id="loadingArea">
        <div class="loading"></div>
        <h1 class="title">認証中</h1>
        <p class="message">サーバーに接続しています...</p>
      </div>
      <div id="resultArea" style="display:none;">
        <h1 class="title" id="resultTitle">ご案内</h1>
        <p class="message" id="resultMessage"></p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // ★ここに新しいGASのデプロイURLを貼り付けてください
      const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbx5kqUSYOCbSZODRZOgcLw5CAkWMoT3HgRi-iVzR7l0RTR6hwOT0lSQ_tQAume_APeuIA/exec';

      function showMessage(title, message, isError) {
        document.getElementById('loadingArea').style.display = 'none';
        const resArea = document.getElementById('resultArea');
        resArea.style.display = 'block';
        document.getElementById('resultTitle').textContent = title;
        const msgEl = document.getElementById('resultMessage');
        msgEl.textContent = message;
        msgEl.className = isError ? 'message error' : 'message';
      }

      function getOrCreateDeviceId() {
        let id = localStorage.getItem('order_device_id');
        if (!id) {
          id = 'dev-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
          localStorage.setItem('order_device_id', id);
        }
        return id;
      }

      async function main() {
        try {
          const params = new URLSearchParams(window.location.search);
          const tableId = (params.get('tableId') || '').trim();
          const deviceId = getOrCreateDeviceId();

          if (!tableId) {
            showMessage('エラー', 'URLに注文ID(?tableId=xxx)が含まれていません。', true);
            return;
          }

          // Fetch実行（Failed to fetch対策としてmode: no-corsは使わず、GAS側で解消する）
          const url = `${GAS_ENDPOINT}?tableId=${encodeURIComponent(tableId)}&deviceId=${encodeURIComponent(deviceId)}`;
          
          const response = await fetch(url).catch(e => {
            throw new Error('ネットワークエラー。GASの公開設定が「全員(Anyone)」になっているか確認してください。');
          });

          if (!response.ok) {
            throw new Error('サーバーエラーが発生しました (Status: ' + response.status + ')');
          }

          const data = await response.json();

          if (data.ok) {
            // 認証成功：AppSheetへ移動
            window.location.replace(data.redirectUrl);
          } else {
            showMessage('アクセス制限', data.message || '認証に失敗しました。', true);
          }

        } catch (error) {
          showMessage('システムエラー', error.message, true);
        }
      }

      main();
    })();
  </script>
</body>
</html>
